  <title>Anniv — リンク一覧</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:      #1a2840;
      --navy-soft: #243550;
      --blue-mid:  #4a8ab5;
      --gold:      #c4a35a;
      --gold-soft: #ddc488;
      --white:     #ffffff;
      --border:    rgba(255,255,255,0.18);
      --glass:     rgba(255,255,255,0.07);
      --glass-hover: rgba(255,255,255,0.13);
      --ease:      cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      background: linear-gradient(160deg, #243550 0%, #1a2840 55%, #0f1c30 100%);
      position: relative;
      overflow: hidden;
    }

    /* 背景の光の滲み */
    body::before {
      content: '';
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(74,138,181,0.18) 0%, transparent 68%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -80px;
      right: 10%;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(196,163,90,0.10) 0%, transparent 68%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ロゴ */
    .logo-wrap {
      margin-bottom: 6px;
    }
    .logo-wrap img {
      height: 72px;
      width: auto;
      filter: brightness(0) invert(1);
      opacity: 0.92;
    }

    /* キャッチコピー */
    .tagline {
      font-family: 'Cormorant Garamond', 'Noto Sans JP', serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .service-desc {
      font-size: 13px;
      font-weight: 300;
      color: rgba(255,255,255,0.62);
      letter-spacing: 0.06em;
      line-height: 1.7;
      text-align: center;
      margin-bottom: 36px;
    }

    /* 区切り線 */
    .divider {
      width: 36px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto 36px;
    }

    /* リンクリスト */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 48px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 22px;
      border-radius: 12px;
      text-decoration: none;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: rgba(255,255,255,0.88);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.06em;
      transition: background 0.25s var(--ease), transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }
    .link-btn:hover {
      background: var(--glass-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.28);
    }
    .link-btn:active {
      transform: translateY(0);
    }

    /* プライマリCTA（LP誘導） */
    .link-btn.primary {
      background: linear-gradient(140deg, #2a3d5c 0%, #1a2840 100%);
      border-color: rgba(196,163,90,0.45);
      box-shadow: 0 6px 24px rgba(0,0,0,0.3), inset 0 1px 0 rgba(196,163,90,0.25);
    }
    .link-btn.primary:hover {
      background: linear-gradient(140deg, #324a70 0%, #243550 100%);
      box-shadow: 0 14px 36px rgba(0,0,0,0.38), inset 0 1px 0 rgba(196,163,90,0.35);
    }
    .link-btn.primary .link-label {
      color: var(--white);
      font-weight: 500;
    }
    .link-btn.primary .link-sub {
      color: var(--gold-soft);
    }

    .link-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
    }
    .link-btn.primary .link-icon {
      background: rgba(196,163,90,0.15);
    }
    .link-icon svg {
      width: 18px;
      height: 18px;
      fill: rgba(255,255,255,0.8);
    }
    .link-btn.primary .link-icon svg {
      fill: var(--gold-soft);
    }

    .link-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .link-label {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.06em;
    }
    .link-sub {
      font-size: 11px;
      font-weight: 300;
      color: rgba(255,255,255,0.42);
      letter-spacing: 0.04em;
    }

    .link-arrow {
      color: rgba(255,255,255,0.3);
      font-size: 16px;
      line-height: 1;
    }
    .link-btn.primary .link-arrow {
      color: rgba(196,163,90,0.6);
    }

    /* フッター */
    .footer {
      font-size: 11px;
      color: rgba(255,255,255,0.24);
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

      <a href="https://lin.ee/U4deTzi" class="link-btn" target="_blank" rel="noopener noreferrer">
        <div class="link-icon">
          <svg viewBox="0 0 24 24"><path d="M19.365 9.863c.349 0 .63.285.631.631 0 .345-.282.63-.631.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.282.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.282.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg>

        <span class="link-arrow">›</span>

          <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>

  </div>

  <script>
    document.querySelectorAll('.link-btn').forEach(function (el) {
      var href = el.getAttribute('href') || '';
      var label = '';
      if (href.indexOf('lin.ee') !== -1) {
        label = 'line';
      } else if (href.indexOf('instagram.com') !== -1) {
        label = 'instagram';
      } else if (href.indexOf('x.com') !== -1) {
        label = 'x';
      } else if (href.indexOf('anniv.gift/media') !== -1) {
        // anniv.gift の判定より先に置くこと。逆にすると media のクリックが lp に混ざる
        label = 'media';
      } else if (href.indexOf('anniv.gift') !== -1) {
        label = 'lp';
      }
      if (!label) return;

      el.addEventListener('click', function () {
        if (label === 'line') {
          if (typeof gtag === 'function') {
            gtag('event', 'line_add_click', { event_category: 'conversion', event_label: 'links' });
          }
          if (typeof fbq === 'function') {
            fbq('track', 'Contact');
          }
        } else {
          if (typeof gtag === 'function') {
            gtag('event', 'links_click', { event_category: 'engagement', event_label: label });
          }
        }
      });
    });
  </script>

</html>
