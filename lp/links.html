<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anniv — リンク一覧</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:      #1a2840;
      --navy-soft: #243550;
      --blue-mid:  #4a8ab5;
      --gold:      #c4a35a;
      --gold-soft: #ddc488;
      --white:     #ffffff;
      --border:    rgba(255,255,255,0.18);
      --glass:     rgba(255,255,255,0.07);
      --glass-hover: rgba(255,255,255,0.13);
      --ease:      cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      background: linear-gradient(160deg, #243550 0%, #1a2840 55%, #0f1c30 100%);
      position: relative;
      overflow: hidden;
    }

    /* 背景の光の滲み */
    body::before {
      content: '';
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(74,138,181,0.18) 0%, transparent 68%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -80px;
      right: 10%;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(196,163,90,0.10) 0%, transparent 68%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ロゴ */
    .logo-wrap {
      margin-bottom: 6px;
    }
    .logo-wrap img {
      height: 72px;
      width: auto;
      filter: brightness(0) invert(1);
      opacity: 0.92;
    }

    /* キャッチコピー */
    .tagline {
      font-family: 'Cormorant Garamond', 'Noto Sans JP', serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .service-desc {
      font-size: 13px;
      font-weight: 300;
      color: rgba(255,255,255,0.62);
      letter-spacing: 0.06em;
      line-height: 1.7;
      text-align: center;
      margin-bottom: 36px;
    }

    /* 区切り線 */
    .divider {
      width: 36px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto 36px;
    }

    /* リンクリスト */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 48px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 22px;
      border-radius: 12px;
      text-decoration: none;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: rgba(255,255,255,0.88);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.06em;
      transition: background 0.25s var(--ease), transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }
    .link-btn:hover {
      background: var(--glass-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.28);
    }
    .link-btn:active {
      transform: translateY(0);
    }

    /* プライマリCTA（LP誘導） */
    .link-btn.primary {
      background: linear-gradient(140deg, #2a3d5c 0%, #1a2840 100%);
      border-color: rgba(196,163,90,0.45);
      box-shadow: 0 6px 24px rgba(0,0,0,0.3), inset 0 1px 0 rgba(196,163,90,0.25);
    }
    .link-btn.primary:hover {
      background: linear-gradient(140deg, #324a70 0%, #243550 100%);
      box-shadow: 0 14px 36px rgba(0,0,0,0.38), inset 0 1px 0 rgba(196,163,90,0.35);
    }
    .link-btn.primary .link-label {
      color: var(--white);
      font-weight: 500;
    }
    .link-btn.primary .link-sub {
      color: var(--gold-soft);
    }

    .link-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
    }
    .link-btn.primary .link-icon {
      background: rgba(196,163,90,0.15);
    }
    .link-icon svg {
      width: 18px;
      height: 18px;
      fill: rgba(255,255,255,0.8);
    }
    .link-btn.primary .link-icon svg {
      fill: var(--gold-soft);
    }

    .link-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .link-label {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.06em;
    }
    .link-sub {
      font-size: 11px;
      font-weight: 300;
      color: rgba(255,255,255,0.42);
      letter-spacing: 0.04em;
    }

    .link-arrow {
      color: rgba(255,255,255,0.3);
      font-size: 16px;
      line-height: 1;
    }
    .link-btn.primary .link-arrow {
      color: rgba(196,163,90,0.6);
    }

    /* フッター */
    .footer {
      font-size: 11px;
      color: rgba(255,255,255,0.24);
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="logo-wrap">
      <img src="assets/logo_trans.png" alt="Anniv">
    </div>

    <p class="tagline">Anniversary Planning</p>

      <!-- X (Twitter) -->
      <a href="https://x.com/Anniv_gift" class="link-btn" target="_blank" rel="noopener noreferrer">
        <div class="link-icon">
          <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.763l7.727-8.835L1.254 2.25H8.08l4.259 5.63L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/></svg>

        <div class="link-text">
          <span class="link-label">X (Twitter)</span>

    </nav>

    <p class="footer">© 2026 Anniv</p>

  </div>
</body>
</html>
